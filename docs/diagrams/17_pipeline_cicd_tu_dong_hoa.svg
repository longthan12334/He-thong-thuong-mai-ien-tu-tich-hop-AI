<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%" style="background:#0b0f19; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers for arrows -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981" />
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="840" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07">
    <path d="M0,50 H1200 M0,100 H1200 M0,150 H1200 M0,200 H1200 M0,250 H1200 M0,300 H1200 M0,350 H1200 M0,400 H1200 M0,450 H1200 M0,500 H1200 M0,550 H1200 M0,600 H1200 M0,650 H1200 M0,700 H1200 M0,750 H1200 M0,800 H1200" stroke="#94a3b8" stroke-width="1"/>
    <path d="M50,0 V840 M100,0 V840 M150,0 V840 M200,0 V840 M250,0 V840 M300,0 V840 M350,0 V840 M400,0 V840 M450,0 V840 M500,0 V840 M550,0 V840 M600,0 V840 M650,0 V840 M700,0 V840 M750,0 V840 M800,0 V840 M850,0 V840 M900,0 V840 M950,0 V840 M1000,0 V840 M1050,0 V840 M1100,0 V840 M1150,0 V840" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(50, 35)">
    <rect x="0" y="0" width="1100" height="75" rx="14" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" filter="url(#cardShadow)"/>
    
    <circle cx="35" cy="37" r="18" fill="#3b82f6" fill-opacity="0.2"/>
    <path d="M26,37 L32,43 L44,31" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="70" y="34" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">AETHELGARD SHOPPING MALL — KIẾN TRÚC PIPELINE CI/CD TỰ ĐỘNG HÓA</text>
    <text x="70" y="56" fill="#94a3b8" font-size="13">Quy Trình Tự Động: Kiểm Thử Đa Tầng, Build Next.js &amp; .NET 10, Smoke Test Docker &amp; Xuất Bản GHCR</text>

    <!-- Badge -->
    <rect x="940" y="24" width="135" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <circle cx="955" cy="38" r="4" fill="#10b981"/>
    <text x="968" y="43" fill="#34d399" font-size="12" font-weight="600">Enterprise Standard</text>
  </g>

  <!-- ==================== COLUMN 1: LOCAL DEVELOPER ==================== -->
  <g transform="translate(50, 135)">
    <!-- Container Box -->
    <rect width="260" height="660" rx="16" fill="#131d31" fill-opacity="0.75" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Group Header -->
    <rect width="260" height="50" rx="16" fill="#1e3a8a" fill-opacity="0.3"/>
    <circle cx="28" cy="25" r="10" fill="#3b82f6" fill-opacity="0.3"/>
    <text x="24" y="29" font-size="12">💻</text>
    <text x="48" y="29" fill="#93c5fd" font-size="14" font-weight="700">1. LẬP TRÌNH VIÊN (LOCAL)</text>

    <!-- Card 1: Local Code -->
    <g transform="translate(20, 75)">
      <rect width="220" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#f1f5f9" font-size="14" font-weight="600">Mã Nguồn Cục Bộ</text>
      <text x="16" y="48" fill="#94a3b8" font-size="12">• Backend (.NET 10 API)</text>
      <text x="16" y="66" fill="#94a3b8" font-size="12">• Frontend (Next.js 15 App)</text>
      <text x="16" y="84" fill="#94a3b8" font-size="12">• CSDL SQLite (8.620 items)</text>
    </g>

    <!-- Arrow down -->
    <path d="M130, 175 L130, 215" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowCyan)"/>

    <!-- Card 2: Local CI Runner -->
    <g transform="translate(20, 225)">
      <rect width="220" height="135" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="0" y="0" width="220" height="28" rx="10" fill="#0891b2" fill-opacity="0.25"/>
      <text x="16" y="20" fill="#67e8f9" font-size="12" font-weight="700">⚡ 1-Click Local CI Runner</text>
      
      <text x="16" y="52" fill="#e2e8f0" font-size="12" font-family="Consolas, monospace">scripts/run-ci-local.cmd</text>
      <text x="16" y="70" fill="#e2e8f0" font-size="12" font-family="Consolas, monospace">scripts/run-ci-local.sh</text>
      
      <path d="M16, 82 H204" stroke="#334155" stroke-width="1"/>
      
      <text x="16" y="100" fill="#10b981" font-size="11" font-weight="600">✓ Test Backend Release</text>
      <text x="16" y="118" fill="#10b981" font-size="11" font-weight="600">✓ Next.js Build &amp; TypeCheck</text>
    </g>

    <!-- Arrow down -->
    <path d="M130, 365 L130, 410" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Card 3: Git Action -->
    <g transform="translate(20, 420)">
      <rect width="220" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" fill="#f1f5f9" font-size="14" font-weight="600">Git Commit &amp; Push</text>
      <text x="16" y="50" fill="#38bdf8" font-size="12" font-family="Consolas, monospace">git push origin hoang</text>
      <text x="16" y="72" fill="#94a3b8" font-size="11">Tạo Pull Request vào main</text>
    </g>

    <!-- Safe Quality Gate Badge -->
    <g transform="translate(20, 545)">
      <rect width="220" height="85" rx="10" fill="#065f46" fill-opacity="0.25" stroke="#10b981" stroke-width="1.2"/>
      <text x="16" y="28" fill="#34d399" font-size="13" font-weight="700">🛡️ Tiêu Chuẩn Quality Gate</text>
      <text x="16" y="48" fill="#a7f3d0" font-size="11">Phát hiện lỗi lập tức tại máy local,</text>
      <text x="16" y="66" fill="#a7f3d0" font-size="11">100% không đẩy mã lỗi lên server.</text>
    </g>
  </g>

  <!-- Connect Column 1 to Column 2 -->
  <path d="M310, 465 L375, 465" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="318" y="455" fill="#60a5fa" font-size="11" font-weight="600">Push / PR</text>

  <!-- ==================== COLUMN 2: GITHUB ACTIONS CI ==================== -->
  <g transform="translate(385, 135)">
    <!-- Container Box -->
    <rect width="475" height="660" rx="16" fill="#131d31" fill-opacity="0.75" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Group Header -->
    <rect width="475" height="50" rx="16" fill="#581c87" fill-opacity="0.3"/>
    <circle cx="28" cy="25" r="10" fill="#8b5cf6" fill-opacity="0.3"/>
    <text x="24" y="29" font-size="12">⚙️</text>
    <text x="48" y="29" fill="#c4b5fd" font-size="14" font-weight="700">2. GITHUB ACTIONS CI PIPELINE (.github/workflows/ci.yml)</text>

    <!-- Trigger info -->
    <g transform="translate(20, 65)">
      <rect width="435" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="23" fill="#cbd5e1" font-size="12">🎯 <tspan font-weight="600">Triggers:</tspan> Push / PR vào các nhánh <tspan fill="#38bdf8" font-family="Consolas, monospace">main</tspan>, <tspan fill="#38bdf8" font-family="Consolas, monospace">master</tspan>, <tspan fill="#38bdf8" font-family="Consolas, monospace">hoang</tspan>, <tspan fill="#38bdf8" font-family="Consolas, monospace">feature/**</tspan></text>
    </g>

    <!-- Parallel Branch Lines -->
    <path d="M237, 105 L237, 125 M125, 125 L350, 125 M125, 125 L125, 140 M350, 125 L350, 140" stroke="#8b5cf6" stroke-width="2"/>

    <!-- Job 1: Backend CI -->
    <g transform="translate(20, 145)">
      <rect width="210" height="210" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
      <rect width="210" height="32" rx="12" fill="#1d4ed8" fill-opacity="0.25"/>
      <text x="12" y="21" fill="#93c5fd" font-size="12" font-weight="700">Job 1: Backend CI (.NET 10)</text>

      <text x="12" y="55" fill="#f8fafc" font-size="11" font-weight="600">Runner: ubuntu-latest</text>
      <text x="12" y="78" fill="#cbd5e1" font-size="11">• Setup .NET 10 (dotnet-install)</text>
      <text x="12" y="100" fill="#cbd5e1" font-size="11">• dotnet restore NuGet</text>
      <text x="12" y="122" fill="#cbd5e1" font-size="11">• dotnet build (-c Release)</text>
      <text x="12" y="144" fill="#34d399" font-size="11" font-weight="600">• dotnet test (8/8 Passed)</text>
      <text x="24" y="162" fill="#94a3b8" font-size="10">- 3/3 Unit Tests</text>
      <text x="24" y="178" fill="#94a3b8" font-size="10">- 5/5 Integration Tests</text>
      <text x="12" y="198" fill="#cbd5e1" font-size="11">• Upload Test Results Artifact</text>
    </g>

    <!-- Job 2: Frontend CI -->
    <g transform="translate(245, 145)">
      <rect width="210" height="210" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
      <rect width="210" height="32" rx="12" fill="#7e22ce" fill-opacity="0.25"/>
      <text x="12" y="21" fill="#d8b4fe" font-size="12" font-weight="700">Job 2: Frontend CI (Next.js)</text>

      <text x="12" y="55" fill="#f8fafc" font-size="11" font-weight="600">Runner: ubuntu-latest</text>
      <text x="12" y="78" fill="#cbd5e1" font-size="11">• Setup Node.js 20 (npm cache)</text>
      <text x="12" y="100" fill="#cbd5e1" font-size="11">• npm ci (Clean install)</text>
      <text x="12" y="122" fill="#34d399" font-size="11" font-weight="600">• tsc --noEmit (0 Type Errors)</text>
      <text x="12" y="144" fill="#cbd5e1" font-size="11">• npm run lint (Code Style)</text>
      <text x="12" y="166" fill="#34d399" font-size="11" font-weight="600">• next build (Production)</text>
      <text x="24" y="184" fill="#94a3b8" font-size="10">- 18/18 Static Pages OK</text>
      <text x="24" y="198" fill="#94a3b8" font-size="10">- Bundle JS Optimization</text>
    </g>

    <!-- Merge lines from Job 1 & 2 down to Docker Job -->
    <path d="M125, 360 L125, 390 L350, 390 L350, 360 M237, 390 L237, 420" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <rect x="172" y="380" width="130" height="20" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="180" y="394" fill="#cbd5e1" font-size="10" font-weight="600">needs: [backend, frontend]</text>

    <!-- Job 3: Docker Smoke Test -->
    <g transform="translate(20, 425)">
      <rect width="435" height="215" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect width="435" height="34" rx="12" fill="#065f46" fill-opacity="0.3"/>
      
      <circle cx="20" cy="17" r="5" fill="#10b981"/>
      <text x="34" y="22" fill="#6ee7b7" font-size="13" font-weight="700">Job 3: Docker Compose Smoke Test (Integration Validation)</text>

      <g transform="translate(16, 48)">
        <!-- Left detail -->
        <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">1. Setup Docker Buildx &amp; Validation</text>
        <text x="12" y="33" fill="#94a3b8" font-size="11">• docker compose config (Cú pháp hợp lệ)</text>
        <text x="12" y="51" fill="#94a3b8" font-size="11">• docker compose up --build -d</text>

        <text x="0" y="80" fill="#e2e8f0" font-size="12" font-weight="600">2. Tự Động Kiểm Tra Sức Khỏe (Healthchecks)</text>
        <text x="12" y="98" fill="#34d399" font-size="11" font-weight="600">✓ Backend API :5000 (HTTP 200 &amp; CSDL SQLite 8.620 SP)</text>
        <text x="12" y="116" fill="#34d399" font-size="11" font-weight="600">✓ Frontend Web :3001 (HTTP 200 OK)</text>

        <text x="0" y="145" fill="#e2e8f0" font-size="12" font-weight="600">3. Dọn Dẹp Môi Trường Runner</text>
        <text x="12" y="163" fill="#94a3b8" font-size="11">• docker compose down -v (Thu hồi tài nguyên an toàn)</text>
      </g>
    </g>
  </g>

  <!-- Connect Column 2 to Column 3 -->
  <path d="M865, 532 L915, 532" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
  <text x="870" y="520" fill="#34d399" font-size="11" font-weight="600">Merge Main</text>

  <!-- ==================== COLUMN 3: GITHUB ACTIONS CD ==================== -->
  <g transform="translate(925, 135)">
    <!-- Container Box -->
    <rect width="225" height="660" rx="16" fill="#131d31" fill-opacity="0.75" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Group Header -->
    <rect width="225" height="50" rx="16" fill="#064e3b" fill-opacity="0.3"/>
    <circle cx="28" cy="25" r="10" fill="#10b981" fill-opacity="0.3"/>
    <text x="24" y="29" font-size="12">🚀</text>
    <text x="48" y="29" fill="#a7f3d0" font-size="14" font-weight="700">3. CD PIPELINE</text>

    <!-- Trigger -->
    <g transform="translate(15, 65)">
      <rect width="195" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="24" fill="#f8fafc" font-size="12" font-weight="600">Sự Kiện Kích Hoạt</text>
      <text x="12" y="44" fill="#38bdf8" font-size="11">• Merge vào main / master</text>
      <text x="12" y="60" fill="#38bdf8" font-size="11">• Gắn thẻ tag v*.*.*</text>
    </g>

    <!-- Arrow down -->
    <path d="M112, 140 L112, 175" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

    <!-- GHCR Registry -->
    <g transform="translate(15, 180)">
      <rect width="195" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect width="195" height="28" rx="10" fill="#047857" fill-opacity="0.3"/>
      <text x="12" y="19" fill="#6ee7b7" font-size="11" font-weight="700">📦 GitHub Container Registry</text>

      <text x="12" y="50" fill="#f8fafc" font-size="11" font-weight="600">Đăng Nhập Bảo Mật</text>
      <text x="12" y="66" fill="#94a3b8" font-size="10">GITHUB_TOKEN (Tự động)</text>

      <path d="M12, 78 H183" stroke="#334155" stroke-width="1"/>

      <text x="12" y="98" fill="#f8fafc" font-size="11" font-weight="600">Xuất Bản Images</text>
      <text x="12" y="116" fill="#38bdf8" font-size="10" font-family="Consolas, monospace">• backend:latest</text>
      <text x="12" y="132" fill="#38bdf8" font-size="10" font-family="Consolas, monospace">• backend:sha-xxxx</text>
      <text x="12" y="152" fill="#c084fc" font-size="10" font-family="Consolas, monospace">• frontend:latest</text>
      <text x="12" y="168" fill="#c084fc" font-size="10" font-family="Consolas, monospace">• frontend:sha-xxxx</text>

      <path d="M12, 180 H183" stroke="#334155" stroke-width="1"/>

      <text x="12" y="200" fill="#34d399" font-size="10" font-weight="600">Tối Ưu Build Cache</text>
      <text x="12" y="216" fill="#94a3b8" font-size="10">GitHub Actions Cache (gha)</text>
    </g>

    <!-- Arrow down -->
    <path d="M112, 420 L112, 455" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)"/>

    <!-- Production Deploy Target -->
    <g transform="translate(15, 460)">
      <rect width="195" height="170" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
      <rect width="195" height="28" rx="10" fill="#b45309" fill-opacity="0.3"/>
      <text x="12" y="19" fill="#fcd34d" font-size="11" font-weight="700">🌐 Môi Trường Triển Khai</text>

      <text x="12" y="50" fill="#f8fafc" font-size="11" font-weight="600">Production / Staging</text>
      <text x="12" y="70" fill="#cbd5e1" font-size="11">• Server VPS / Kubernetes</text>
      <text x="12" y="88" fill="#cbd5e1" font-size="11">• Docker Compose Pull</text>
      <text x="12" y="106" fill="#cbd5e1" font-size="11">• Zero-Downtime Reload</text>
      
      <rect x="12" y="125" width="171" height="30" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <text x="24" y="144" fill="#34d399" font-size="11" font-weight="700">✓ SẴN SÀNG TRIỂN KHAI</text>
    </g>
  </g>
</svg>

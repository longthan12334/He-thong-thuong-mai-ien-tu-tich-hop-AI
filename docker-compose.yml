services:
  # ========================================================
  # 1. Backend Web API (.NET 10)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aethelgard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/fashion_mall.db
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
      - Gemini__Model=gemini-3-flash-preview
      - Jwt__Key=${Jwt__Key:-AethelgardSuperSecretKey2026NguyenDucManh9999!}
      - Jwt__Issuer=${Jwt__Issuer:-AethelgardMall}
      - Jwt__Audience=${Jwt__Audience:-AethelgardMallClients}
      - PasswordResetSmtp__Host=${PASSWORD_RESET_SMTP_HOST:-}
      - PasswordResetSmtp__Port=${PASSWORD_RESET_SMTP_PORT:-587}
      - PasswordResetSmtp__From=${PASSWORD_RESET_SMTP_FROM:-}
      - PasswordResetSmtp__Username=${PASSWORD_RESET_SMTP_USERNAME:-}
      - PasswordResetSmtp__Password=${PASSWORD_RESET_SMTP_PASSWORD:-}
    volumes:
      # Lưu trữ CSDL SQLite bền vững không bị mất dữ liệu khi restart container
      - sqlite_data:/app/data
    networks:
      - aethelgard-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/products?pageSize=1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ========================================================
  # 2. Frontend Web App (Next.js 16)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    container_name: aethelgard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/login').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aethelgard-network

volumes:
  sqlite_data:
    driver: local

networks:
  aethelgard-network:
    driver: bridge

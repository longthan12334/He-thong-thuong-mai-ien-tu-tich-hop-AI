services:
  # ========================================================
  # 1. Backend Web API (.NET 10)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aethelgard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Gemini__ApiKey=${GEMINI_API_KEY:-}
      - Gemini__Model=gemini-3-flash-preview
      - Jwt__Key=AethelgardSuperSecretKey2026NguyenDucManh9999!
      - Jwt__Issuer=AethelgardMall
      - Jwt__Audience=AethelgardMallClients
    volumes:
      # Lưu trữ CSDL SQLite bền vững không bị mất dữ liệu khi restart container
      - sqlite_data:/app/data
    networks:
      - aethelgard-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/products?pageSize=1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ========================================================
  # 2. Frontend Web App (Next.js 16)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aethelgard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_started
    networks:
      - aethelgard-network

volumes:
  sqlite_data:
    driver: local

networks:
  aethelgard-network:
    driver: bridge

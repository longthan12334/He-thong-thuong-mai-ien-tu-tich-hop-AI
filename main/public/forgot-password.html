<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi Phục Mật Khẩu — DM Fashion Mall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #F8FAFC;
    }
    .card-box {
      width: 460px;
      max-width: 90vw;
      background: #FFFFFF;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    .otp-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 20px 0;
    }
    .otp-inputs input {
      width: 48px;
      height: 52px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid var(--border);
      outline: none;
    }
    .otp-inputs input:focus {
      border-color: #0F172A;
    }
  </style>
</head>
<body>

  <div class="card-box">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="index.html" style="text-decoration: none; color: #0F172A; font-size: 20px; font-weight: 800;">
        <span style="background: #0F172A; color: #fff; padding: 4px 8px; border-radius: 6px;">DM</span> Fashion Mall
      </a>
      <h2 style="font-size: 24px; font-weight: 700; margin: 16px 0 6px;">Khôi Phục Mật Khẩu</h2>
      <p style="font-size: 14px; color: var(--text-muted);">Hệ thống xác thực bảo mật qua mã OTP</p>
    </div>

    <!-- STEP 1: ENTER EMAIL -->
    <div id="step-1">
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Email tài khoản của bạn *</label>
        <input type="email" id="fp-email" required placeholder="name@example.com" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; outline: none; box-sizing: border-box;">
      </div>
      <button id="btn-send-otp" style="width: 100%; background: #0F172A; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer;">
        Gửi Mã Xác Thực OTP
      </button>
    </div>

    <!-- STEP 2: VERIFY OTP -->
    <div id="step-2" style="display: none;">
      <p style="font-size: 13px; color: var(--text-muted); text-align: center;">Mã OTP 6 số đã được gửi đến email. Vui lòng kiểm tra và nhập bên dưới:</p>
      <div class="otp-inputs">
        <input type="text" maxlength="1" class="otp-digit">
        <input type="text" maxlength="1" class="otp-digit">
        <input type="text" maxlength="1" class="otp-digit">
        <input type="text" maxlength="1" class="otp-digit">
        <input type="text" maxlength="1" class="otp-digit">
        <input type="text" maxlength="1" class="otp-digit">
      </div>
      <button id="btn-verify-otp" style="width: 100%; background: #0F172A; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer;">
        Xác Thực Mã OTP
      </button>
    </div>

    <!-- STEP 3: RESET PASSWORD -->
    <div id="step-3" style="display: none;">
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;">Mật khẩu mới (tối thiểu 6 ký tự) *</label>
        <input type="password" id="new-password" required placeholder="••••••••" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; outline: none; box-sizing: border-box;">
      </div>
      <button id="btn-save-password" style="width: 100%; background: #0F172A; color: #fff; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer;">
        Lưu Mật Khẩu Mới
      </button>
    </div>

    <div style="margin-top: 24px; text-align: center;">
      <a href="auth.html" style="font-size: 13px; color: var(--text-muted); text-decoration: none;">← Quay lại trang Đăng Nhập</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let currentEmail = "";
    let currentOtp = "";

    // OTP auto-focus
    const otpInputs = document.querySelectorAll(".otp-digit");
    otpInputs.forEach((input, index) => {
      input.addEventListener("input", (e) => {
        if (e.target.value.length === 1 && index < otpInputs.length - 1) {
          otpInputs[index + 1].focus();
        }
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !e.target.value && index > 0) {
          otpInputs[index - 1].focus();
        }
      });
    });

    // Step 1: Send OTP
    document.getElementById("btn-send-otp").addEventListener("click", async () => {
      const email = document.getElementById("fp-email").value.trim();
      if (!email) {
        showToast("Vui lòng nhập email của bạn.", "error");
        return;
      }
      currentEmail = email;
      const btn = document.getElementById("btn-send-otp");
      try {
        btn.disabled = true;
        btn.textContent = "Đang gửi OTP...";
        const res = await API.post("/auth/forgot-password", { email });
        showToast(res.message || "Đã gửi mã OTP!");
        if (res.otp_mock) {
          console.log("Mã OTP thử nghiệm:", res.otp_mock);
          // Autofill for testing convenience
          res.otp_mock.split("").forEach((digit, i) => {
            if (otpInputs[i]) otpInputs[i].value = digit;
          });
        }
        document.getElementById("step-1").style.display = "none";
        document.getElementById("step-2").style.display = "block";
        otpInputs[0].focus();
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Gửi Mã Xác Thực OTP";
      }
    });

    // Step 2: Verify OTP
    document.getElementById("btn-verify-otp").addEventListener("click", async () => {
      let otp = "";
      otpInputs.forEach(i => otp += i.value);
      if (otp.length !== 6) {
        showToast("Vui lòng nhập đủ 6 chữ số OTP.", "error");
        return;
      }
      currentOtp = otp;
      const btn = document.getElementById("btn-verify-otp");
      try {
        btn.disabled = true;
        btn.textContent = "Đang kiểm tra...";
        await API.post("/auth/verify-otp", { email: currentEmail, otp });
        showToast("Mã OTP hợp lệ! Hãy nhập mật khẩu mới.");
        document.getElementById("step-2").style.display = "none";
        document.getElementById("step-3").style.display = "block";
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Xác Thực Mã OTP";
      }
    });

    // Step 3: Reset password
    document.getElementById("btn-save-password").addEventListener("click", async () => {
      const new_password = document.getElementById("new-password").value;
      if (new_password.length < 6) {
        showToast("Mật khẩu mới phải có ít nhất 6 ký tự.", "error");
        return;
      }
      const btn = document.getElementById("btn-save-password");
      try {
        btn.disabled = true;
        btn.textContent = "Đang cập nhật...";
        const res = await API.post("/auth/reset-password", {
          email: currentEmail,
          otp: currentOtp,
          new_password
        });
        showToast(res.message || "Đặt lại mật khẩu thành công!");
        setTimeout(() => window.location.href = "auth.html", 1200);
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Lưu Mật Khẩu Mới";
      }
    });
  </script>
</body>
</html>

server:
  port: 8080

spring:
  application:
    name: dm-fashion-data-tools
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./fashion_data;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.dmfashion.datatools: DEBUG
